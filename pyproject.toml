[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkvoodoo"
version = "1.1.1"
description = "Offline-first batch video transcoder for mobile playback"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - SynonTech" }
authors = [{ name = "SynonTech" }]

dependencies = [
    "plyer>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-bdd>=7.1",
    "pytest-mock>=3.14",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "flake8>=7.0",
]

[project.scripts]
mkvoodoo = "backend.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
